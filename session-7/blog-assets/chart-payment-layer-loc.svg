  <text x="24" y="58" font-size="13" fill="#9AA0AE">Lines of TypeScript per component — MOI Builders session 7</text>

  <!-- rows: y start 92, row height 44, bar h 22, label col 250, max bar width 420 for 171 -->
  <g font-size="13" fill="#8A8F9C">
    <text x="24" y="106">registry.ts — discovery by skill</text>
    <rect x="250" y="92" width="420" height="22" rx="4" fill="#8B8AF0" opacity="0.85"/>
    <text x="678" y="108" font-weight="700" fill="#8A8F9C">171</text>

    <text x="24" y="150">verify-proof.ts — the seller's 7 checks</text>
    <rect x="250" y="136" width="334" height="22" rx="4" fill="#8B8AF0" opacity="0.85"/>
    <text x="592" y="152" font-weight="700" fill="#8A8F9C">136</text>

    <text x="24" y="194">pay.ts — pay, then prove it</text>
    <rect x="250" y="180" width="332" height="22" rx="4" fill="#8B8AF0" opacity="0.85"/>
    <text x="590" y="196" font-weight="700" fill="#8A8F9C">135</text>

    <text x="24" y="238">payment-proof.ts — the wire format</text>
    <rect x="250" y="224" width="307" height="22" rx="4" fill="#8B8AF0" opacity="0.85"/>
